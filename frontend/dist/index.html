<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流量统计 · qbit_limit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <!-- Top nav -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                    </svg>
                </span>
                <span class="brand-word">qbit_limit</span>
            </div>
            <div class="nav-meta">
                <span class="product-pill">Traffic Monitor</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Hero -->
        <header class="hero">
            <div class="eyebrow">Bandwidth Control</div>
            <h1 class="display">qBittorrent 上行流量守门员</h1>
            <p class="subhead">监控每日 / 每月上行用量，达到阈值自动压速。下方为当月汇总与最近 30 天明细。</p>
        </header>

        <!-- Current month -->
        <section class="section">
            <div class="section-head">
                <span class="eyebrow">Current Month</span>
                <h2 class="headline">当月总流量统计</h2>
            </div>

            <div class="stats-grid">
                <article class="stat-card stat-card--upload">
                    <div class="stat-card-row">
                        <span class="stat-icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="16 12 12 8 8 12"></polyline>
                                <line x1="12" y1="16" x2="12" y2="8"></line>
                            </svg>
                        </span>
                        <span class="stat-label">当月总上行流量</span>
                    </div>
                    <div class="stat-value" id="month-upload">0 B</div>
                    <div class="stat-foot">Upload · Terraform identity</div>
                </article>

                <article class="stat-card stat-card--download">
                    <div class="stat-card-row">
                        <span class="stat-icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="8 12 12 16 16 12"></polyline>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                            </svg>
                        </span>
                        <span class="stat-label">当月总下行流量</span>
                    </div>
                    <div class="stat-value" id="month-download">0 B</div>
                    <div class="stat-foot">Download · Waypoint identity</div>
                </article>
            </div>
        </section>

        <!-- Recent 30 days -->
        <section class="section">
            <div class="section-head">
                <span class="eyebrow">Last 30 Days</span>
                <h2 class="headline">最近 30 天流量记录</h2>
            </div>

            <div class="scroll-area" id="logs-container">
                <div class="logs-list" id="logs-list">
                    <!-- Logs will be inserted here by app.js -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-word">qbit_limit</span>
            <span class="footer-meta">每 60 秒自动刷新 · Flask + SQLite</span>
        </div>
    </footer>

    <script src="app.js?v=4"></script>
</body>
</html>
